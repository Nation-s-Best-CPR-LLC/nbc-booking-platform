{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="wrap error-page">
  <span class="eyebrow">Error {{ code }}</span>
  <h1 class="title">{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <p><a class="pill" href="{{ url_for('public.home') }}#classes">See available classes <span class="arrow" aria-hidden="true">→</span></a></p>
</div>
{% endblock %}
